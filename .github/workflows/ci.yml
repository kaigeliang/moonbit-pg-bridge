name: Bridge checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Check and test
        env:
          PG_BRIDGE_TARGET: ${{ matrix.target }}
        run: |
          moon version --all
          moon update
          moon check --target "$PG_BRIDGE_TARGET" --deny-warn
          moon test --target "$PG_BRIDGE_TARGET"
          scripts/integration.sh
